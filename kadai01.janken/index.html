<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課題のジャンケンアプリ</title>
    <!-- ページの設定を書くのでCSSもここに指定する -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>👊✌️🖐️じゃんけんゲーム👊✌️🖐️</h1>
  <h2>さぁ！どれを出す！？</h2>

<div class="buttons">
  <button id="guu">✊ぐー</button>
  <button id="choki">✌️ちょき</button>
  <button id="pa">🖐️ぱー</button>
</div>

<div class="texts">
<p id="computer">対戦相手：</p>
<p id="result">勝負の結果：</p>
</div>

<img id="judge-image" src="" alt="勝負結果の画像">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- JavaScriptを読み込む -->
  <script src="js/script.js"></script>

</body>
</html>
